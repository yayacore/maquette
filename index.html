<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>YAYA Airlines </title>

</head>

<body>

    <header>
        <div class="header">
            <div class="logo">
                <img src="logoCie.png" alt="logo compagnie" height="80px">
            </div>

            <nav>
                <a href="#">ABOUT US</a>
                <a href="">TOUR</a>
                <a href="">PACKAGE</a>
                <a href="">CONTACT</a>
            </nav>

            <button type="button">Book trip</button>
        </div>
    </header>

    <main>
        
        <section class="plane_block">
            <div class="accroche">
                <p>ELEVATE YOUR TRAVEL JOURNEY</p>
                <h2>Experience
                    the magic of 
                    flight !
                </h2>

                <div class="cta">       <!-- cta = Call to Action -->
                    <button type="button">Book a trip now</button>
                    <img src="player.png" alt="bouton player">
                </div>

            </div>

            <div class="plane_object">
                <img src="planewthtb.png" alt="plane">
            </div>

        </section>

        <div class="medias">
            <div class="socials">
                <p>Follow</p>
                <img class= "socials" src="tt.png" alt="twitter">
                <img class="socials" src="fb.png" alt="facebook">
                <img class="socials" src="inst.png" alt="ig">
                <img class="socials" src="git.png" alt="gh">
            </div>
            
            <div class="reservation">
                <img class="booking" src="airbnb.png" alt="airbnb">
                <img class="booking" src="bkg.png" alt="booking">
                <img class="booking" src="trivago.png" alt="trivago">
                <img class="booking" src="xpedia.png" alt="expédia">
            </div>
        </div>

        <section class="purchase">
            <div class="description">
                <div class="txt">
                    <h1>Popular destination</h1>
                    <small>Unleash your wanderlust with skywings</small>
                </div>

                <div class="arrows">
                    <img class="fleche" src="arrow.png" alt="">
                    <img class="fleche" src="arrow_full.png" alt="">
                    
                </div>
            </div>

            <div class="journey">
                <div class="voyages">
                    <img src="plane.jpeg" alt="destination" height="20%">
                    <img src="plane.jpeg" alt="destination" height="20%">
                    <img src="plane.jpeg" alt="destination" height="20%">
                </div>
                
                <div class="journey_loc">
                    <div class="Bali">
                        <h2>Forest wild life</h2>
                        <small>Bali, Indonesia</small>
                        <img class="icon" src="location.png" alt="location" height="14px">
                    </div>

                    <div class="Palma">
                        <h2>Forest wild life</h2>
                        <small>Bali, Indonesia</small>
                        <img class="icon" src="location.png" alt="location" height="14px">
                    </div>

                    <div class="Torronto">
                        <h2>Forest wild life</h2>
                        <small>Bali, Indonesia</small>
                        <img class="icon" src="location.png" alt="location" height="14px">
                    </div>
                </div>


            </div>






        </section>









        





    </main>



</body>
</html>
